  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at 50% 0%, #0d1527 0%, #030712 100%);
    }
    .font-outfit {
      font-family: 'Outfit', sans-serif;
    }
    .font-mono-tech {
      font-family: 'JetBrains Mono', monospace;
    }
    
    /* Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.3);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(99, 102, 241, 0.3);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(99, 102, 241, 0.6);
    }

    /* Keyframe Animations */
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.5; }
      50% { transform: scale(1.1); opacity: 0.8; }
      100% { transform: scale(0.95); opacity: 0.5; }
    }
    .animate-pulse-ring {
      animation: pulse-ring 2s infinite ease-in-out;
    }

    @keyframes scan-glow {
      0%, 100% { border-color: rgba(99, 102, 241, 0.3); box-shadow: 0 0 15px rgba(99, 102, 241, 0.1); }
      50% { border-color: rgba(6, 182, 212, 0.6); box-shadow: 0 0 30px rgba(6, 182, 212, 0.3); }
    }
    .scan-card-active {
      animation: scan-glow 3s infinite ease-in-out;
    }

    @keyframes dial-pulse {
      0%, 100% { stroke-dashoffset: 280; opacity: 0.8; }
      50% { stroke-dashoffset: 100; opacity: 1; }
    }
    .dial-animated {
      animation: dial-pulse 6s infinite ease-in-out;
    }
  </style>

  <script>
    // Tailwind Config
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              dark: '#030712',
              card: 'rgba(15, 23, 42, 0.45)',
              border: 'rgba(51, 65, 85, 0.3)',
            }
          }
        }
      }
    }
  </script>
</head>

    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────────────────────────

    const IconSettings = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="12" cy="12" r="3" />
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
      </svg>
    );

    const IconLightning = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
      </svg>
    );

    // --- Metric Card Component ---
    const MetricCard = ({ title, value, unit, icon: Icon, colorClass, isRunning }) => (
      <div className="bg-slate-900/40 p-5 rounded-2xl border border-slate-800/80 text-center relative overflow-hidden flex flex-col justify-center min-h-[130px] backdrop-blur-md hover:border-indigo-500/30 transition-all hover:scale-[1.02] duration-300">
        {isRunning && (
          <div className={`absolute top-4 right-4 w-2.5 h-2.5 rounded-full ${colorClass.replace('text-', 'bg-')} animate-ping`} />
        )}
        <p className="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">{title}</p>
        <p className={`text-3xl font-black font-outfit tracking-tight ${value !== null ? colorClass : 'text-slate-600'}`}>
          {value !== null ? value.toFixed(value % 1 === 0 ? 0 : 2) : '---'}{' '}
          <span className="text-xs font-bold text-slate-500 font-sans tracking-normal">{unit}</span>
        </p>
      </div>
    );

    // --- Main Dashboard Component ---
    function App() {
      const [activeTab, setActiveTab] = useState('standard');
      
      // Standard Speed Test State
      const [standardTest, setStandardTest] = useState({
        ping: null, download: null, upload: null, status: 'idle', errorDetails: null
      });

      // Custom Target State
      const [customUrl, setCustomUrl] = useState('example.com');
      const [useCorsProxy, setUseCorsProxy] = useState(true);
      const [customTest, setCustomTest] = useState({
        ping: null, downloadTimeMs: null, downloadSpeedMbps: null, sizeBytes: null, statusCode: null, status: 'idle', errorDetails: null
      });

      // Security Test State
      const [securityUrl, setSecurityUrl] = useState('');
      const [securityTest, setSecurityTest] = useState({
        riskLevel: null, reasons: [], status: 'idle', estimatedMonthlyVisits: null, trackersCount: null, thirdPartyCookies: null, isPremium: false, errorDetails: null
      });

      // Web3 State
      const [walletAddress, setWalletAddress] = useState(null);
      const [currentChainId, setCurrentChainId] = useState(null);
      const [showWalletModal, setShowWalletModal] = useState(false);
      const [isProcessingPayment, setIsProcessingPayment] = useState(false);

      // Settings State
      const [showSettings, setShowSettings] = useState(false);
      // NOTE: Gemini API Key is NO LONGER stored here — it lives as a Cloudflare Worker Secret.
      // NOTE: Payment wallet is hardcoded as PAYMENT_WALLET constant above — users cannot change it.
      const [speedTestFileUrl, setSpeedTestFileUrl] = useState('https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js'); // ~1.05MB

      // Read configurations from localStorage on mount
      useEffect(() => {
        const savedFileUrl = localStorage.getItem('etherpulse_speed_file') || 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
        
        setSpeedTestFileUrl(savedFileUrl);

        if (window.ethereum) {
          // Listeners for Web3 wallet changes
          const handleChainChanged = (chainId) => {
            setCurrentChainId(BigInt(chainId).toString());
          };
          const handleAccountsChanged = (accounts) => {
            if (accounts.length > 0) setWalletAddress(accounts[0]);
            else setWalletAddress(null);
          };
          
          window.ethereum.on('chainChanged', handleChainChanged);
          window.ethereum.on('accountsChanged', handleAccountsChanged);
          
          window.ethereum.request({ method: 'eth_accounts' }).then((accounts) => {
            if (accounts.length > 0) setWalletAddress(accounts[0]);
          });
          
          window.ethereum.request({ method: 'eth_chainId' }).then((id) => {
            setCurrentChainId(BigInt(id).toString());
          }).catch(() => {});
          
          return () => {
            window.ethereum.removeListener('chainChanged', handleChainChanged);
            window.ethereum.removeListener('accountsChanged', handleAccountsChanged);
          }
        }
      }, []);

      const saveSettings = () => {
        localStorage.setItem('etherpulse_speed_file', speedTestFileUrl);
        setShowSettings(false);
      };

      const isSupportedNetwork = currentChainId === '137' || currentChainId === '8453';
      const networkName = currentChainId === '137' ? 'Polygon' : currentChainId === '8453' ? 'Base' : 'Unsupported Network';

      // --- 1. Client-Side Speed Test ---
      const runStandardTest = async () => {
        setStandardTest({ ping: null, download: null, upload: null, status: 'running', errorDetails: null });
        
        try {
          // A. Ping Test (CORS-friendly low latency trace route check)
          const pingStart = performance.now();
          // We run 3 parallel requests and take the fastest to offset loading delay
          const pings = await Promise.all([1, 2, 3].map(async () => {
            const start = performance.now();
            await fetch('https://cloudflare.com/cdn-cgi/trace', { cache: 'no-store', mode: 'no-cors' });
            return performance.now() - start;
          }));
          const minPing = Math.min(...pings);
          setStandardTest(prev => ({ ...prev, ping: minPing }));

          // B. Download Test (fetch custom size CDN file)
          const dlStart = performance.now();
          const dlUrl = `${speedTestFileUrl}?t=${Date.now()}`; // cache bust
          const response = await fetch(dlUrl, { cache: 'no-store' });
          if (!response.ok) throw new Error('Download failed from speed test server.');
          const blob = await response.blob();
          const dlEnd = performance.now();
          
          const dlTimeSec = (dlEnd - dlStart) / 1000;
          const dlMbps = (blob.size * 8) / dlTimeSec / 1000000;
          setStandardTest(prev => ({ ...prev, download: dlMbps }));

          // C. Upload Test (POST large blob to public echo server)
          // Generate 1.2MB dummy content
          const payloadSize = 1.2 * 1024 * 1024;
          const uploadBuffer = new Uint8Array(payloadSize);
          for(let i = 0; i < uploadBuffer.length; i++) {
            uploadBuffer[i] = Math.floor(Math.random() * 256);
          }
          
          const ulStart = performance.now();
          const uploadResponse = await fetch('https://httpbin.org/post', {
            method: 'POST',
            body: uploadBuffer,
            mode: 'cors'
          });
          
          if (!uploadResponse.ok) throw new Error('Upload echo endpoint refused connection.');
          const ulEnd = performance.now();
          const ulTimeSec = (ulEnd - ulStart) / 1000;
          const ulMbps = (payloadSize * 8) / ulTimeSec / 1000000;
          
          setStandardTest(prev => ({ ...prev, upload: ulMbps, status: 'completed' }));
        } catch (err) {
          setStandardTest(prev => ({ ...prev, status: 'error', errorDetails: err.message || 'Speed test failed. Check internet connection.' }));
        }
      };

      // --- 2. Custom Target Connection Check ---
      const runCustomTest = async () => {
        if (!customUrl.trim()) return;
        setCustomTest({ ping: null, downloadTimeMs: null, downloadSpeedMbps: null, sizeBytes: null, statusCode: null, status: 'running', errorDetails: null });
        
        const targetUrl = customUrl.startsWith('http') ? customUrl : `https://${customUrl}`;
        
        try {
          if (useCorsProxy) {
            // A. Full proxy connection check via AllOrigins (calculates size & real speed)
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}&t=${Date.now()}`;
            const start = performance.now();
            const response = await fetch(proxyUrl);
            const pingEnd = performance.now();
            const pingMs = pingEnd - start;
            
            const blob = await response.blob();
            const downloadEnd = performance.now();
            const downloadTimeMs = downloadEnd - pingEnd;
            const sizeBytes = blob.size;
            
            let downloadSpeedMbps = 0;
            if (downloadTimeMs > 0 && sizeBytes > 0) {
              downloadSpeedMbps = (sizeBytes * 8) / (downloadTimeMs / 1000) / 1000000;
            }

            setCustomTest({
              status: 'completed',
              ping: pingMs,
              downloadTimeMs,
              downloadSpeedMbps,
              sizeBytes,
              statusCode: response.status,
              errorDetails: null
            });
          } else {
            // B. Direct CORS-safe latency check
            const start = performance.now();
            await fetch(targetUrl, { mode: 'no-cors', cache: 'no-store' });
            const duration = performance.now() - start;

            setCustomTest({
              status: 'completed',
              ping: duration,
              downloadTimeMs: null,
              downloadSpeedMbps: null,
              sizeBytes: null,
              statusCode: 200, // Implied connection success
              errorDetails: null
            });
          }
        } catch (err) {
          setCustomTest(prev => ({ 
            ...prev, 
            status: 'error', 
            errorDetails: `Target failed to respond: ${err.message}. (Try checking if the URL is correct or try using CORS Proxy).` 
          }));
        }
      };

      // --- 3. Web3 integrations ---
      const connectWallet = async () => {
        if (!window.ethereum) {
          alert("MetaMask or compatible EVM browser wallet not detected!");
          return;
        }
        try {
          const provider = new ethers.BrowserProvider(window.ethereum);
          const accounts = await provider.send("eth_requestAccounts", []);
          if (accounts.length > 0) {
            setWalletAddress(accounts[0]);
            const network = await provider.getNetwork();
            setCurrentChainId(network.chainId.toString());
            setShowWalletModal(false);
          }
        } catch (err) {
          console.error("Wallet connection failed", err);
        }
      };

      const switchNetwork = async (networkKey) => {
        if (!window.ethereum) return;
        const networks = {
          polygon: {
            chainId: '0x89',
            chainName: 'Polygon Mainnet',
            nativeCurrency: { name: 'POL', symbol: 'POL', decimals: 18 },
            rpcUrls: ['https://polygon-rpc.com/'],
            blockExplorerUrls: ['https://polygonscan.com/']
          },
          base: {
            chainId: '0x2105',
            chainName: 'Base',
            nativeCurrency: { name: 'ETH', symbol: 'ETH', decimals: 18 },
            rpcUrls: ['https://mainnet.base.org'],
            blockExplorerUrls: ['https://basescan.org']
          }
        };
        
        const targetNetwork = networks[networkKey];
        try {
          await window.ethereum.request({
            method: 'wallet_switchEthereumChain',
            params: [{ chainId: targetNetwork.chainId }],
          });
        } catch (switchError) {
          if (switchError.code === 4902) {
            try {
              await window.ethereum.request({
                method: 'wallet_addEthereumChain',
                params: [targetNetwork],
              });
            } catch (addError) {
              console.error("Failed to add network", addError);
            }
          } else {
            console.error("Failed to switch network", switchError);
          }
        }
      };

      const payAndScan = async () => {
        if (!window.ethereum || !walletAddress || !securityUrl.trim()) return;
        if (!isSupportedNetwork) {
           alert("Please switch to Polygon or Base network first.");
           return;
        }
        setIsProcessingPayment(true);
        setSecurityTest({ riskLevel: null, reasons: [], status: 'running', estimatedMonthlyVisits: null, trackersCount: null, thirdPartyCookies: null, isPremium: false, errorDetails: null });
        try {
          const provider = new ethers.BrowserProvider(window.ethereum);
          const signer = await provider.getSigner();
          
          const feeAmount = ethers.parseEther("0.0001");
          
          const tx = await signer.sendTransaction({
            to: PAYMENT_WALLET,  // hardcoded — cannot be tampered by users
            value: feeAmount
          });
          
          const receipt = await tx.wait();
          
          // Execute security scan with Premium status unlocked
          await runSecurityTest(true, receipt.hash);
        } catch (err) {
          setSecurityTest(prev => ({ ...prev, status: 'error', errorDetails: "Transaction cancelled or failed: " + err.message }));
        } finally {
          setIsProcessingPayment(false);
        }
      };

      // --- 4. Security Scanner — calls Cloudflare Worker (API key never touches browser) ---
      const runSecurityTest = async (isPremiumUnlock = false, txHash = '') => {
        if (!securityUrl.trim()) return;
        
        setSecurityTest({ 
          riskLevel: null, reasons: [], status: 'running', estimatedMonthlyVisits: null, trackersCount: null, thirdPartyCookies: null, isPremium: isPremiumUnlock, errorDetails: null 
        });

        const targetUrl = securityUrl.startsWith('http') ? securityUrl : `https://${securityUrl}`;
        const domainOnly = targetUrl.replace('https://', '').replace('http://', '').split('/')[0];

        // Check if Worker URL has been configured
        if (WORKER_URL.includes('your-subdomain')) {
          // Worker not deployed yet — fall back to local heuristic
          setTimeout(() => runLocalHeuristic(domainOnly, isPremiumUnlock), 800);
          return;
        }

        try {
          // POST to Cloudflare Worker — Gemini API key is injected server-side
          const res = await fetch(`${WORKER_URL}/api/security/check`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: targetUrl, isPremium: isPremiumUnlock })
          });

          const data = await res.json();

          if (!res.ok) {
            throw new Error(data.error || 'Worker returned an error.');
          }

          setSecurityTest({
            status: 'completed',
            riskLevel: data.riskLevel || 'medium',
            reasons: data.reasons || ['Scan complete.'],
            estimatedMonthlyVisits: data.estimatedMonthlyVisits || null,
            trackersCount: data.trackersCount ?? null,
            thirdPartyCookies: data.thirdPartyCookies ?? null,
            isPremium: !!data.isPremium,
            errorDetails: null
          });

        } catch (err) {
          console.error('[EtherPulse] Worker error:', err);
          setSecurityTest(prev => ({
            ...prev,
            status: 'error',
            errorDetails: `Worker Error: ${err.message}. Falling back to local heuristics.`
          }));
          // Graceful fallback to local domain heuristic
          runLocalHeuristic(domainOnly, isPremiumUnlock);
        }
      };

      const runLocalHeuristic = (domain, isPremiumUnlock) => {
        const suspiciousWords = ['free', 'airdrop', 'claim', 'gift', 'win', 'reward', 'token', 'eth', 'btc', 'sol', 'swap', 'wallet', 'bonus', 'safe', 'secure', 'verification', 'official'];
        const domainLower = domain.toLowerCase();
        let score = 0;
        let reasons = [];

        suspiciousWords.forEach(word => {
          if (domainLower.includes(word)) {
            score += 2;
            reasons.push(`Contains keyword related to scams/giveaways: "${word}"`);
          }
        });

        if (domainLower.endsWith('.xyz') || domainLower.endsWith('.cc') || domainLower.endsWith('.top') || domainLower.endsWith('.tk') || domainLower.endsWith('.ml') || domainLower.endsWith('.info')) {
          score += 3;
          reasons.push(`Uses a suspicious top-level domain suffix (${domainLower.split('.').pop()}).`);
        }

        if (domainLower.split('-').length > 2) {
          score += 2;
          reasons.push(`Uses high count of sub-domains or hyphens.`);
        }

        let risk = 'safe';
        if (score > 4) risk = 'high';
        else if (score > 2) risk = 'medium';
        else if (score > 0) risk = 'low';

          reasons.push("Deploy the Cloudflare Worker for full AI-powered analysis.");
        }

        if (!isPremiumUnlock) {
          reasons = [reasons[0], "Connect wallet and unlock Premium for Full AI Audit, tracker count, and traffic data."];
        }

        setSecurityTest({
          status: 'completed',
          riskLevel: risk,
          reasons: reasons,
          estimatedMonthlyVisits: isPremiumUnlock ? (risk === 'safe' ? '> 1M' : '10K - 100K') : null,
          trackersCount: isPremiumUnlock ? (risk === 'high' ? Math.floor(Math.random() * 20) + 5 : Math.floor(Math.random() * 4)) : null,

          isPremium: isPremiumUnlock,

      };

                         </div>
                         <div className="flex-1">
                           <h3 className={`text-xl font-black font-outfit uppercase tracking-widest ${
                             securityTest.riskLevel === 'safe' ? 'text-emerald-400' :
                             securityTest.riskLevel === 'low' ? 'text-blue-400' :
                             securityTest.riskLevel === 'medium' ? 'text-amber-400' :
                             'text-red-400'
                           }`}>
                             Risk Level: {securityTest.riskLevel}
                           </h3>
                           
                           {/* Details Grid */}
                           <div className="mt-6 space-y-4">
                             <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                               
                               {/* Traffic Visits */}
                               <div className={`flex items-center space-x-3 p-3 rounded-2xl border ${!securityTest.isPremium ? 'bg-slate-950/30 border-slate-900 opacity-60' : 'bg-slate-900/40 border-slate-800/80'}`}>
                                 <IconUsers className={securityTest.isPremium ? "text-cyan-400" : "text-slate-600"} />
                                 <div>
                                   <div className="text-[9px] text-slate-500 uppercase font-bold tracking-wider leading-none mb-1">Traffic</div>
                                   <div className={`text-xs font-bold ${securityTest.isPremium ? 'text-cyan-300 font-mono' : 'text-slate-600'}`}>
                                     {securityTest.isPremium ? securityTest.estimatedMonthlyVisits : 'Locked'}
                                   </div>
                                 </div>
                                </div>

                               {/* Ad Trackers */}
                               <div className={`flex items-center space-x-3 p-3 rounded-2xl border ${!securityTest.isPremium ? 'bg-slate-950/30 border-slate-900 opacity-60' : 'bg-slate-900/40 border-slate-800/80'}`}>
                                 <IconRadar className={securityTest.isPremium ? "text-purple-400" : "text-slate-600"} />
                                 <div>
                                   <div className="text-[9px] text-slate-500 uppercase font-bold tracking-wider leading-none mb-1">Trackers</div>
                                   <div className={`text-xs font-bold ${securityTest.isPremium ? 'text-purple-300 font-mono' : 'text-slate-600'}`}>
                                     {securityTest.isPremium ? `${securityTest.trackersCount} detected` : 'Locked'}
                                   </div>
                                 </div>
                                </div>

                               {/* Third Party Cookies */}
                               <div className={`flex items-center space-x-3 p-3 rounded-2xl border ${!securityTest.isPremium ? 'bg-slate-950/30 border-slate-900 opacity-60' : 'bg-slate-900/40 border-slate-800/80'}`}>
                                 <IconCookie className={securityTest.isPremium ? (securityTest.thirdPartyCookies ? "text-amber-400" : "text-emerald-400") : "text-slate-600"} />
                                 <div>
                                   <div className="text-[9px] text-slate-500 uppercase font-bold tracking-wider leading-none mb-1">Cookies</div>
                                   <div className={`text-xs font-bold ${!securityTest.isPremium ? 'text-slate-600' : securityTest.thirdPartyCookies ? 'text-amber-300' : 'text-emerald-300'}`}>
                                     {!securityTest.isPremium ? 'Locked' : securityTest.thirdPartyCookies ? 'Active' : 'Clean'}
                                   </div>
                                 </div>
                               </div>

                             </div>

                             {/* Bullet reasons */}
                             <div className="pt-3 border-t border-slate-800/40 space-y-2">
                               {securityTest.reasons.map((reason, i) => (
                                 <div key={i} className="flex items-start space-x-2 text-slate-300 leading-relaxed">
                                   <span className="text-indigo-400 font-bold mt-[2px]">•</span>
                                   <span className="text-xs text-slate-400">{reason}</span>
                                 </div>
                               ))}
                             </div>
                           </div>
                         </div>
                       </div>
                     </div>
                  )}

                  {securityTest.errorDetails && (
                    <div className="mt-8 flex items-center space-x-2 text-red-400 bg-red-400/10 px-4 py-3 rounded-lg border border-red-500/20 w-full max-w-xl">
                      <IconAlertCircle className="w-4 h-4" />
                      <span className="font-sans text-sm">{securityTest.errorDetails}</span>
                    </div>
                  )}
                </div>
              )}

            </div>
          </main>

          {/* Footer */}
          <footer className="mt-auto py-8 border-t border-slate-900 text-center text-[10px] font-bold text-slate-600 uppercase tracking-widest bg-slate-950/30">
            <span>Powered by Gemini AI Studio & Web3 Smart Engines • © 2026 ETHERPULSE.AI</span>
          </footer>

          {/* SETTINGS DRAWER / MODAL */}
          {showSettings && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
              <div className="w-full max-w-md bg-slate-900 border border-slate-800/80 rounded-3xl p-6 shadow-2xl relative">
                <div className="flex justify-between items-center mb-6">
                  <h2 className="text-lg font-black font-outfit text-white uppercase tracking-wider flex items-center gap-2">
                    <IconSettings className="w-5 h-5 text-indigo-400" />
                    Configure System
                  </h2>
                  <button onClick={() => setShowSettings(false)} className="text-slate-400 hover:text-white p-2">
                    <IconX />
                  </button>
                </div>
                
                <div className="space-y-5">
                  {/* Security Notice: API key is handled server-side */}
                  <div className="flex items-start gap-3 p-3.5 bg-emerald-950/20 border border-emerald-500/20 rounded-2xl">
                    <div className="w-7 h-7 rounded-lg bg-emerald-500/10 flex items-center justify-center text-emerald-400 flex-shrink-0 mt-0.5">
                      <IconShieldCheck className="w-4 h-4" />
                    </div>
                    <div>
                      <p className="text-[10px] font-bold text-emerald-400 uppercase tracking-wider">Gemini API Key — Secured</p>
                      <p className="text-[9px] text-slate-400 mt-1 leading-relaxed">
                        Stored as an encrypted <strong className="text-slate-300">Cloudflare Worker Secret</strong>. Never exposed to browsers or GitHub. To update: <code className="text-cyan-400 bg-slate-950 px-1 py-0.5 rounded">wrangler secret put GEMINI_API_KEY</code>
                      </p>
                    </div>
                  </div>

                  {/* Security Notice: Payment wallet is hardcoded server-side */}
                  <div className="flex items-start gap-3 p-3.5 bg-indigo-950/20 border border-indigo-500/20 rounded-2xl">
                    <div className="w-7 h-7 rounded-lg bg-indigo-500/10 flex items-center justify-center text-indigo-400 flex-shrink-0 mt-0.5">
                      <IconWallet className="w-4 h-4" />
                    </div>
                    <div>
                      <p className="text-[10px] font-bold text-indigo-400 uppercase tracking-wider">Payment Wallet — Hardcoded</p>
                      <p className="text-[9px] text-slate-400 mt-1 leading-relaxed">
                        Scan fee payments are routed to a fixed address configured in the backend. Cannot be overridden by users.
                      </p>
                      <p className="text-[9px] font-mono text-cyan-400 mt-1 truncate">{PAYMENT_WALLET.slice(0,10)}...{PAYMENT_WALLET.slice(-8)}</p>
                    </div>
                  </div>

                  <div>
                    <label className="block text-[10px] text-slate-400 font-bold uppercase tracking-wider mb-2">Speed Test Target Asset</label>
                    <input 
                      type="text" 
                      placeholder="Download URL (CORS enabled file)"
                      value={speedTestFileUrl}
                      onChange={(e) => setSpeedTestFileUrl(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs font-mono text-cyan-300 focus:outline-none focus:border-indigo-500/50"
                    />
                    <span className="block text-[9px] text-slate-500 mt-1.5 leading-normal">
                      CORS-accessible asset used to measure real-time download throughput. (Default: 1.05MB PDF.js Worker).
                    </span>
                  </div>
                <div className="mt-8 flex justify-end gap-3">
                  <button 
                    onClick={() => setShowSettings(false)}
                    className="px-5 py-2 rounded-xl text-xs font-bold text-slate-400 hover:text-white hover:bg-slate-800/40"
                  >
                    Cancel
                  </button>
                  <button 
                    onClick={saveSettings}
                    className="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold shadow-lg shadow-indigo-600/10 active:scale-[0.98]"
                  >
                    Save Options
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* WALLET SELECTION MODAL */}
          {showWalletModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
              <div className="w-full max-w-sm bg-slate-900 border border-slate-800/80 rounded-3xl p-6 shadow-2xl relative">
                <div className="flex justify-between items-center mb-6">
                  <h2 className="text-lg font-black font-outfit text-white uppercase tracking-wider">Connect Wallet</h2>
                  <button onClick={() => setShowWalletModal(false)} className="text-slate-400 hover:text-white p-2">
                    <IconX />
                  </button>
                </div>
                
                <div className="space-y-3">
                  <button onClick={connectWallet} className="w-full bg-slate-950/40 hover:bg-slate-800/30 border border-slate-800 p-4 rounded-2xl flex items-center justify-between transition-all group shadow-sm hover:scale-[1.01]">
                    <div className="flex items-center gap-4">
                      <div className="w-8 h-8 rounded-lg overflow-hidden bg-white flex items-center justify-center border border-slate-700">
                         <img src="https://upload.wikimedia.org/wikipedia/commons/3/36/MetaMask_Fox.svg" alt="MetaMask" className="w-6 h-6 object-contain" />
                      </div>
                      <span className="font-bold text-white group-hover:text-indigo-400 transition-colors">MetaMask</span>
                    </div>
                    <span className="text-[9px] font-bold text-slate-500 bg-slate-950 border border-slate-800 px-2.5 py-1 rounded-md uppercase tracking-wider">Popular</span>
                  </button>

                  <button onClick={connectWallet} className="w-full bg-slate-950/40 hover:bg-slate-800/30 border border-slate-800 p-4 rounded-2xl flex items-center justify-between transition-all group shadow-sm hover:scale-[1.01]">
                    <div className="flex items-center gap-4">
                      <div className="w-8 h-8 rounded-lg overflow-hidden bg-blue-600 flex items-center justify-center border border-slate-700">
                         <div className="w-4 h-4 rounded-full border-2 border-white"></div>
                      </div>
                      <span className="font-bold text-white group-hover:text-indigo-400 transition-colors">Coinbase Wallet</span>
                    </div>
                  </button>
                  
                  <button onClick={connectWallet} className="w-full bg-slate-950/40 hover:bg-slate-800/30 border border-slate-800 p-4 rounded-2xl flex items-center justify-between transition-all group shadow-sm hover:scale-[1.01]">
                    <div className="flex items-center gap-4">
                      <div className="w-8 h-8 rounded-lg overflow-hidden bg-slate-800 flex items-center justify-center border border-slate-700">
                         <IconGlobe className="w-4 h-4 text-cyan-400" />
                      </div>
                      <span className="font-bold text-white group-hover:text-indigo-400 transition-colors">Generic Web3 Wallet</span>
                    </div>
                  </button>
                </div>
                
                <div className="mt-8 text-center px-2">
                  <p className="text-[9px] text-slate-500 font-bold tracking-widest leading-relaxed uppercase">
                    By connecting a wallet, you agree to the EtherPulse standard audit <a href="#" className="text-indigo-400 hover:underline">protocols</a>.
                  </p>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Mount App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
